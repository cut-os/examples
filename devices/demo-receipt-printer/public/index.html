<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1,maximum-scale=1,user-scalable=no">
  <title><%= htmlWebpackPlugin.options.title %></title>
</head>
<body>
<div class="header">
  <div class="params" id="params-title"></div>
  <div class="net-status" id="netStatus"></div>
</div>
<div class="stage">
  <div class="modules">
    <div class="code-wrap">
      <div class="api-name">LWA Info</div>
      <div class="result-section">
        <div>name: <span id="lwa-name"></span></div>
        <div>version: <span id="lwa-version"></span></div>
        <div>description: <span id="lwa-description"></span></div>
      </div>
      
    </div>
    <div class="code-wrap">
      <div class="api-name">Printer Info</div>
      <div class="printer-content" id="info">
          <p>二维码</p>
          <p> 脉搏：60 次/分</p>
          <p> 舒张压：60 mmHg</p>
          <p> 收缩压：101 mmHg</p>
          <p> 血压：</p>
          <p> 测量结果：</p>
      </div>
      
    </div>
  </div>
  <div class="btn-wrap">
    <button type="button" class="btn primary" id="print_test_page"><span>打印</span></button>
  </div>
</div>
</body>
</html>
